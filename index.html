<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Fonts are self-hosted from /public/fonts — no third-party request.
      Only the two weights that render above the fold are preloaded:
      Inter Tight 700 (h1) and Inter 400 (body copy).
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-tight-latin-700-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-400-normal.woff2"
      crossorigin
    />

    <title>TelicomLink — Data Center Services</title>
    <meta
      name="description"
      content="TelicomLink delivers 24/7 data center deployment, remote hands, testing, and colocation across Europe and APAC."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
